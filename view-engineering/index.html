<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engineering View — Track</title>
    <!--
      これはデバッグ用計測器であり、製品レンダラではない（DECISIONS.md ADR-0003）。
      装飾のための CSS を足さないこと。数値が読めることだけを目的にする。
      ビルドツールは使わない。素の ES module + import map で動かす。
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101216;
        color: #dfe4ea;
        font: 12px/1.5 "Consolas", "Courier New", monospace;
      }
      #viewport {
        position: absolute;
        inset: 0;
      }
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #panel {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 260px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid #333c46;
      }
      #panel .title {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 4px;
      }
      #panel table {
        width: 100%;
        border-collapse: collapse;
      }
      #panel th {
        text-align: left;
        font-weight: normal;
        color: #8b95a1;
        padding-right: 6px;
        white-space: nowrap;
      }
      #panel td {
        text-align: right;
      }
      .section {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid #2a3038;
      }
      .label {
        color: #8b95a1;
        margin-bottom: 3px;
      }
      .note {
        color: #6d7883;
        margin-top: 3px;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: #8b95a1;
      }
      .ticks .tick:nth-child(even) {
        visibility: hidden;
      }
      #legend-bar {
        display: block;
        width: 100%;
        height: 14px;
      }
      .row {
        color: #6d7883;
      }
      .row.on {
        color: #dfe4ea;
      }
      kbd {
        display: inline-block;
        min-width: 12px;
        margin-right: 6px;
        padding: 0 3px;
        text-align: center;
        border: 1px solid #444e59;
        background: #1b2027;
      }
      #readout {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid #333c46;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
      }
      #readout b {
        color: #8b95a1;
        font-weight: normal;
        margin-right: 4px;
      }
      .error {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="overlay"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
