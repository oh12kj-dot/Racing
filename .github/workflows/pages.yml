name: Deploy Racing Game to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6

      - name: Install runtime Three.js
        run: npm install --omit=dev --no-audit --no-fund

      - name: Assemble self-contained static site
        shell: bash
        run: |
          SITE="$RUNNER_TEMP/racing-site"
          rm -rf "$SITE"
          mkdir -p "$SITE/assets" "$SITE/node_modules"
          cp -R iphone-demo "$SITE/iphone-demo"
          cp -R assets/render "$SITE/assets/render"
          cp -R node_modules/three "$SITE/node_modules/three"
          cat > "$SITE/index.html" <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./iphone-demo/index.html"><title>Racing 3D</title><script>location.replace('./iphone-demo/index.html');</script></head><body><a href="./iphone-demo/index.html">Racing 3Dを起動</a></body></html>
          HTML
          touch "$SITE/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/racing-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  remote-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify GitHub Pages production build boots
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const url='https://oh12kj-dot.github.io/Racing/iphone-demo/index.html?runtimeTest=1';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log(`[browser:${m.type()}] ${m.text()}`));
          page.on('pageerror',e=>console.log(`[pageerror] ${e.message}`));
          page.on('requestfailed',r=>console.log(`[requestfailed] ${r.url()} :: ${r.failure()?.errorText||''}`));
          let response=null,lastError=null;
          for(let attempt=1;attempt<=6;attempt++){
            try{
              response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              if(response?.status()===200)break;
              lastError=new Error(`HTTP ${response?.status()}`);
            }catch(e){lastError=e;}
            await page.waitForTimeout(5000);
          }
          console.log(`[navigate] status=${response?.status()} type=${response?.headers()?.['content-type']||''} url=${page.url()}`);
          if(response?.status()!==200)throw lastError||new Error(`GitHub Pages returned ${response?.status()}`);
          await page.waitForFunction(()=>!!(window.__RACING_RACE__&&window.__RACING_WORLD__&&window.__RACING_REGRESSION_MONITOR__)||document.querySelector('#status')?.textContent==='ERROR',null,{timeout:45000});
          const state=await page.evaluate(()=>({ready:!!(window.__RACING_RACE__&&window.__RACING_WORLD__&&window.__RACING_REGRESSION_MONITOR__),status:document.querySelector('#status')?.textContent||'',error:document.querySelector('#error')?.textContent||'',three:window.__RACING_THREE_SOURCE__||null}));
          console.log(JSON.stringify({url,state},null,2));
          await browser.close();
          if(!state.ready||state.status==='ERROR')throw new Error(state.error||`Remote boot failed: ${state.status||'NO_STATUS'}`);
          if(state.three?.kind!=='local-npm')throw new Error(`Expected bundled Three.js, got ${JSON.stringify(state.three)}`);
          NODE
