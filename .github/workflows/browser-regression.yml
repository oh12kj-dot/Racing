name: Browser Regression

on:
  push:
    paths:
      - 'iphone-demo/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/browser-regression.yml'
  pull_request:
    paths:
      - 'iphone-demo/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: browser-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      already-passed: ${{ steps.prior.outputs.already_passed }}
    steps:
      - name: Check for an existing successful run of this exact SHA
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "already_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/browser-regression.yml/runs?per_page=100")"

          already_passed="$(jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length > 0' \
            <<< "$runs")"
          echo "already_passed=${already_passed}" >> "$GITHUB_OUTPUT"

  browser-regression:
    needs: preflight
    if: needs.preflight.outputs.already-passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression shard ${{ matrix.shard }}/4
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-4
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-regression-gate:
    if: always()
    needs: [preflight, browser-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Verify regression coverage passed
        env:
          ALREADY_PASSED: ${{ needs.preflight.outputs.already-passed }}
          SHARD_RESULT: ${{ needs.browser-regression.result }}
        run: |
          if [[ "$ALREADY_PASSED" == "true" ]]; then
            echo "This exact SHA already passed Browser Regression; duplicate master rerun skipped."
            exit 0
          fi
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "One or more Browser Regression shards failed: ${SHARD_RESULT}"
            exit 1
          fi
          echo "All Browser Regression shards passed."
