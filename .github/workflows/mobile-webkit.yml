name: iPhone WebKit Regression

on:
  push:
    paths:
      - 'iphone-demo/**'
      - 'tests/browser/ios-runtime.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/mobile-webkit.yml'
  pull_request:
    paths:
      - 'iphone-demo/**'
      - 'tests/browser/ios-runtime.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'

concurrency:
  group: iphone-webkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone WebKit regression
        run: npm run test:ios
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
