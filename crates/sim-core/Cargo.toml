[package]
name = "sim-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fixed-timestep simulation world: binds sim-vehicle physics to a sim-track surface."

# 依存は sim-math + sim-track + sim-vehicle + sim-line + sim-driver。物理エンジン
# crate は使わない（DECISIONS.md ADR-0005）。この crate は乱数状態を保持しない
# （乱数は呼び出し側が Rng を作って spawn_with_driver に渡す。src/rng.rs は派生規約
# だけの状態を持たない自由関数）。
[dependencies]
sim-math = { path = "../sim-math" }
sim-track = { path = "../sim-track" }
sim-vehicle = { path = "../sim-vehicle" }
sim-line = { path = "../sim-line", default-features = false }
sim-driver = { path = "../sim-driver", default-features = false }
