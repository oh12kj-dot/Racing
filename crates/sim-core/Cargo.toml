[package]
name = "sim-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fixed-timestep simulation world: binds sim-vehicle physics to a sim-track surface."

# 依存は sim-math + sim-track + sim-vehicle のみ。物理エンジン crate は使わない
# （DECISIONS.md ADR-0005）。この crate は乱数を一切持たない。
[dependencies]
sim-math = { path = "../sim-math" }
sim-track = { path = "../sim-track" }
sim-vehicle = { path = "../sim-vehicle" }
