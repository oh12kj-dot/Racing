[package]
name = "sim-line"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Racing line system: corridor, reference trajectory, and physics-derived speed profile."

# 依存は sim-math + sim-track + sim-vehicle のみ。物理エンジン crate も乱数 crate も
# 使わない（DECISIONS.md ADR-0005）。この crate は乱数・時刻依存・グローバル状態を持たない。
# sim-vehicle への依存は &VehicleParams を読むためだけ（人間承認 2026-09-09）。
[dependencies]
sim-math = { path = "../sim-math" }
sim-track = { path = "../sim-track", default-features = false }
sim-vehicle = { path = "../sim-vehicle", default-features = false }

[features]
# 既定で serde を有効化し、下流（sim-core）が JSON ローダを使えるようにする。
# --no-default-features で依存が sim-math 相当まで軽くなる（WASM / FFI 向け）。
default = ["serde"]
serde = ["sim-track/serde", "sim-vehicle/serde"]
