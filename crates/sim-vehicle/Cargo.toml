[package]
name = "sim-vehicle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rigid-body vehicle dynamics for the race simulation core."

# 依存は sim-math のみ。docs/phase-1b-vehicle.md の「責務の境界」により
# sim-track へは依存させず、路面は GroundProbe トレイト経由で受け取る。
# 物理エンジン crate は使わない（DECISIONS.md ADR-0005）。
[dependencies]
sim-math = { path = "../sim-math" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
approx = "0.5"
