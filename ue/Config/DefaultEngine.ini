; ue/Config/DefaultEngine.ini
; ---------------------------------------------------------------------------
; Realistic Race Spectator Simulator — UE5 feasibility spike (TASK-05-1).
;
; Code-First rule (ADR-0004, constraint 3): renderer configuration lives HERE
; as text. It must NOT be set through the editor Project Settings GUI.
;
; IMPORTANT (docs/phase-0.5-tasks.md, "レンダラ設定の方針"):
;   The keys below express INTENT. UE 5.8's actual setting keys were NOT
;   guessed-verified at authoring time. tools/ue_python/measure.py reads the
;   effective values back after the editor applies this file; every line
;   tagged  ; VERIFY  must be confirmed there, and anything that could not be
;   confirmed is recorded as "未確認" in docs/phase-0.5-results.md.
; ---------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
; A -game launch (the M3/M4 render pass, tools/ue_python/profile_gpu.py) needs a
; GameMode so a PlayerController + pawn are spawned and the render loop keeps
; running; without one the process loads the map and self-terminates before
; CsvProfiler drops a frame (docs/phase-0.5-results.md §profile_gpu.py, diag 1).
; GameModeBase's default DefaultPawn is a free-flying spectator-style pawn, which
; is all the spike needs — the CineCameraActor in L_Spike auto-activates for
; Player 0, so that pawn's own view is never seen. The build_scene.py
; player_start step drops a PlayerStart at the broadcast rig so the pawn spawns
; on the scene, not at world origin (the Aoyama slice sits far from 0,0,0).
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12   ; HWRT + Lumen HWRT need DX12
; Force SM6 as the only targeted shader format. MEASURED 2026-09-10: a -game
; launch was applying r.RayTracing / r.Nanite.ProjectEnabled / r.Lumen.
; HardwareRayTracing as cvars but the render still ran at feature level SM5
; ("LogD3D12RHI: Skipped NVAPI RT queries since ... below SM6"), so Nanite and
; hardware RT never actually engaged and the M3/M4 numbers were an SM5 floor.
; SM6 is required for both. ; VERIFY[M1][M3] via the run log's rhifeaturelevel.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Dynamic global illumination + reflections: Lumen ---
r.DynamicGlobalIlluminationMethod=1          ; VERIFY[M1] 1 = Lumen
r.ReflectionMethod=1                         ; VERIFY[M2] 1 = Lumen reflections
r.Lumen.HardwareRayTracing=True              ; VERIFY[M2] use the Ada RT cores
r.Lumen.HardwareRayTracing.LightingMode=2    ; VERIFY[M2] hit lighting for surface reflections
; --- Ray tracing master switch (required for Lumen HWRT) ---
r.RayTracing=True                            ; VERIFY[M2]
r.RayTracing.Shadows=False                   ; VSM handles shadows; keep RT budget for reflections
; --- Geometry: Nanite ---
r.Nanite.ProjectEnabled=True                 ; VERIFY[M1]
; --- Shadows: Virtual Shadow Maps ---
r.Shadow.Virtual.Enable=1                    ; VERIFY[M1]
; --- Anti-aliasing: TSR (DLSS plugin replaces this once installed) ---
r.AntiAliasingMethod=4                       ; VERIFY[M5] 4 = TSR
; --- Exposure: manual, fixed. Broadcast footage must not auto-flicker. ---
r.DefaultFeature.AutoExposure=False          ; VERIFY[M1] see docs/phase-0.5-tasks.md 露出
r.DefaultFeature.AutoExposure.Method=0
; --- Motion blur: on, per-object. Wheel motion vectors checked in M5. ---
r.DefaultFeature.MotionBlur=True             ; VERIFY[M5]
r.MotionBlurQuality=4
; --- Frame Generation is NOT used (PROJECT.md §6). No setting = off. ---
; --- Texture streaming pool: keep inside the 7.0 GB VRAM budget (M4). ---
r.Streaming.PoolSize=3000                    ; VERIFY[M4] MB; tune against nvidia-smi
r.Streaming.LimitPoolSizeToVRAM=1            ; VERIFY[M4]
; --- Output resolution target ---
r.SetRes=1920x1080w                          ; VERIFY[M3] windowed 1080p

[/Script/Engine.Engine]
; Deterministic, unattended runs: never pop dialogs, never wait for input.
bSmoothFrameRate=False

[/Script/UnrealEd.CookerSettings]
; Content-only project; no plugin cook targets to declare yet.

