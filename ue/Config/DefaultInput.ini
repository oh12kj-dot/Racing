; ue/Config/DefaultInput.ini
; ---------------------------------------------------------------------------
; The spectator does not drive (PROJECT.md). Phase 0.5 has no interactive
; input at all — the scene is scripted and captured headlessly. This file
; exists so the project's input config is text-owned from the start
; (ADR-0004) rather than being created later by the editor.
; ---------------------------------------------------------------------------

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=NoCapture
bEnableMouseSmoothing=False
bEnableGestureRecognizer=False
bUseAutohls=False
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
