<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Racing 3D - Suzuka</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bbce0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;z-index:20;left:12px;top:max(12px,env(safe-area-inset-top));padding:7px 9px;border:1px solid #ffffff28;border-radius:10px;background:#07121bb8;backdrop-filter:blur(10px);font-size:11px;font-weight:800;line-height:1.4}#hud b{color:#67ff9b}#cam{display:none;position:fixed;z-index:20;left:12px;bottom:calc(max(78px,env(safe-area-inset-bottom) + 66px));padding:8px 10px;border-radius:9px;background:#07121bd0;font-size:12px;font-weight:800}#controls{display:none;position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));gap:6px;padding:7px;border-radius:15px;background:#07121bec;border:1px solid #ffffff32;backdrop-filter:blur(10px)}button{appearance:none;-webkit-appearance:none;border:1px solid #ffffff38;background:#ffffff14;color:#fff;height:42px;min-width:52px;border-radius:10px;font-size:11px;font-weight:900;padding:0 9px}button:active{transform:scale(.94);background:#ffffff40}button.active{background:#fff;color:#07121b}#error{display:none;position:fixed;z-index:60;left:12px;right:12px;top:32%;padding:14px;border-radius:12px;background:#651414ee;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="hud">SUZUKA 3D · <b id="status">BOOTING</b><br><span id="speed">GRID · -- km/h</span></div>
<div id="cam">AUTO · TV · 360°</div>
<div id="controls"><button data-mode="TV">TV</button><button data-mode="CHASE">CHASE</button><button data-mode="HELI">HELI</button><button data-mode="AUTO" class="active">AUTO</button><button id="prev">◀</button><button id="next">▶</button></div>
<div id="error"></div>
<script>
setTimeout(()=>{const s=document.getElementById('status');if(['BOOTING','LOADING 3D','BUILDING TRACK'].includes(s.textContent)){const stage=s.textContent;s.textContent='ERROR';const e=document.getElementById('error');e.style.display='block';e.textContent='起動が停止しました。停止段階: '+stage+'。Safariで再読み込みしてください。';}},16000);
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
