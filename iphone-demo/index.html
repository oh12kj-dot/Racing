<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Racing iPhone Demo</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061018;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:white;touch-action:manipulation}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#top{position:fixed;z-index:5;left:12px;top:max(12px,env(safe-area-inset-top));padding:8px 11px;border:1px solid #ffffff2a;border-radius:10px;background:#061018b8;backdrop-filter:blur(10px);font-weight:900;font-size:13px}#top b{color:#5cff90}#cam{position:fixed;z-index:5;left:12px;bottom:calc(max(78px,env(safe-area-inset-bottom) + 66px));padding:8px 10px;border-radius:8px;background:#061018c9;font-weight:800;font-size:12px}#controls{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px;border-radius:15px;background:#061018dd;border:1px solid #ffffff2a;backdrop-filter:blur(10px)}button{appearance:none;border:1px solid #ffffff30;background:#ffffff12;color:white;height:42px;min-width:52px;border-radius:10px;font-weight:900;font-size:11px;padding:0 9px}button:active{transform:scale(.94);background:#ffffff35}button.active{background:white;color:#081018}#err{display:none;position:fixed;z-index:20;left:12px;right:12px;top:40%;padding:14px;border-radius:12px;background:#5a1010ee;line-height:1.45;font-size:12px}</style></head><body><canvas id="c"></canvas><div id="top">HTTPS TEST · <b id="status">STARTING</b></div><div id="cam">AUTO · TV</div><div id="controls"><button data-m="TV">TV</button><button data-m="CHASE">CHASE</button><button data-m="HELI">HELI</button><button data-m="AUTO" class="active">AUTO</button><button id="prev">◀</button><button id="next">▶</button></div><div id="err"></div><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),status=document.getElementById('status'),camEl=document.getElementById('cam'),err=document.getElementById('err');if(!x){err.style.display='block';err.textContent='Canvasを開始できません';return}let W=0,H=0,dpr=1;function size(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();const TAU=Math.PI*2;const cars=Array.from({length:14},(_,i)=>({a:i/14*TAU,l:(i%3-1)*7,s:.34+(i%5)*.007,col:['#ff3535','#3991ff','#ffd43b','#fff','#2ae48e','#b36cff','#ff8b32'][i%7]}));let mode='AUTO',auto='TV',focus=0,lastAuto=0,frame=0,lastT=performance.now();function p(car){const R1=155,R2=88;return {X:Math.cos(car.a)*(R1+car.l),Z:Math.sin(car.a)*(R2+car.l)}}function cam(t){const f=p(cars[focus]);let cx=0,cz=0,zoom=1;if(t==='CHASE'){cx=f.X*.72;cz=f.Z*.72;zoom=2.0}else if(t==='HELI'){cx=f.X*.18;cz=f.Z*.18;zoom=.72}else{const q=performance.now()/3500;cx=Math.cos(q)*72;cz=Math.sin(q)*34;zoom=1.12}return{cx,cz,zoom}}function project(P,C){const sx=(P.X-C.cx)*C.zoom,sz=(P.Z-C.cz)*C.zoom;const depth=1+sz/260;return{x:W/2+sx/depth,y:H*.55+sz*.38/depth,s:1/depth}}function track(C){const pts=[];for(let i=0;i<=120;i++){const a=i/120*TAU;pts.push(project({X:Math.cos(a)*155,Z:Math.sin(a)*88},C))}x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.strokeStyle='#142414';x.lineWidth=64*C.zoom;x.stroke();x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.strokeStyle='#34373a';x.lineWidth=39*C.zoom;x.stroke();x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.strokeStyle='#e8e8e8';x.lineWidth=2*C.zoom;x.setLineDash([10,12]);x.stroke();x.setLineDash([])}function drawCar(car,i,C){const P=p(car),q=project(P,C),ang=car.a+Math.PI/2,w=12*q.s*C.zoom,h=6*q.s*C.zoom;x.save();x.translate(q.x,q.y);x.rotate(ang*.35);x.fillStyle='#0008';x.fillRect(-w*.55,-h*.1,w*1.1,h*.8);x.fillStyle=car.col;x.fillRect(-w/2,-h/2,w,h);x.fillStyle='#101820';x.fillRect(-w*.18,-h*.44,w*.36,h*.52);if(i===focus){x.strokeStyle='white';x.lineWidth=2;x.strokeRect(-w*.6,-h*.7,w*1.2,h*1.4)}x.restore()}function render(now){const active=mode==='AUTO'?auto:mode,C=cam(active);const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#73a9d0');sky.addColorStop(.55,'#c9ddea');sky.addColorStop(.551,'#6a8f54');sky.addColorStop(1,'#274126');x.fillStyle=sky;x.fillRect(0,0,W,H);track(C);const order=cars.map((car,i)=>({car,i,z:p(car).Z})).sort((a,b)=>a.z-b.z);for(const o of order)drawCar(o.car,o.i,C);x.fillStyle='#0008';x.fillRect(10,H-126,150,34);x.fillStyle='white';x.font='700 12px -apple-system';x.fillText(`CAR ${focus+1} · ${active}`,20,H-104)}function tick(now){const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;for(let i=0;i<cars.length;i++)cars[i].a=(cars[i].a+cars[i].s*dt)%(TAU);if(mode==='AUTO'&&now-lastAuto>5000){lastAuto=now;auto=auto==='TV'?'CHASE':auto==='CHASE'?'HELI':'TV';camEl.textContent='AUTO · '+auto}render(now);frame++;if(frame===2)status.textContent='RUNNING';requestAnimationFrame(tick)}function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('active',b.dataset.m===m));camEl.textContent=m==='AUTO'?'AUTO · '+auto:m;render(performance.now())}document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));document.getElementById('next').addEventListener('click',()=>{focus=(focus+1)%cars.length;render(performance.now())});document.getElementById('prev').addEventListener('click',()=>{focus=(focus-1+cars.length)%cars.length;render(performance.now())});window.addEventListener('error',e=>{err.style.display='block';err.textContent='Error: '+e.message});requestAnimationFrame(tick)})();</script></body></html>
