<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Racing iPhone Demo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061018;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:white;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;z-index:5;left:12px;top:max(12px,env(safe-area-inset-top));padding:8px 11px;border:1px solid #ffffff2a;border-radius:10px;background:#061018b8;backdrop-filter:blur(10px);font-weight:900;font-size:13px}
#top b{color:#5cff90}
#cam{position:fixed;z-index:5;left:12px;bottom:calc(max(78px,env(safe-area-inset-bottom) + 66px));padding:8px 10px;border-radius:8px;background:#061018c9;font-weight:800;font-size:12px}
#controls{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px;border-radius:15px;background:#061018dd;border:1px solid #ffffff2a;backdrop-filter:blur(10px)}
button{appearance:none;border:1px solid #ffffff30;background:#ffffff12;color:white;height:42px;min-width:52px;border-radius:10px;font-weight:900;font-size:11px;padding:0 9px}
button:active{transform:scale(.94);background:#ffffff35}
button.active{background:white;color:#081018}
#err{display:none;position:fixed;z-index:20;left:12px;right:12px;top:40%;padding:14px;border-radius:12px;background:#5a1010ee;line-height:1.45;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">RACE DYNAMICS · <b id="status">STARTING</b></div>
<div id="cam">AUTO · TV</div>
<div id="controls">
<button data-m="TV">TV</button><button data-m="CHASE">CHASE</button><button data-m="HELI">HELI</button><button data-m="AUTO" class="active">AUTO</button><button id="prev">◀</button><button id="next">▶</button>
</div>
<div id="err"></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),x=c.getContext('2d'),status=document.getElementById('status'),camEl=document.getElementById('cam'),err=document.getElementById('err');
if(!x){err.style.display='block';err.textContent='Canvasを開始できません';return}
let W=0,H=0,dpr=1;
function size(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size,{passive:true});size();

const CP=[
[-399.5,-42.5],
[-365.5,-161.5],
[-263.5,-234.6],
[-127.5,-263.5],
[25.5,-255.0],
[153.0,-224.4],
[263.5,-170.0],
[357.0,-93.5],
[399.5,17.0],
[377.4,119.0],
[306.0,190.4],
[212.5,224.4],
[132.6,200.6],
[88.4,139.4],
[34.0,105.4],
[-30.6,115.6],
[-93.5,178.5],
[-156.4,224.4],
[-246.5,209.1],
[-331.5,149.6],
[-387.6,68.0]
].map(([X,Z])=>({X,Z}));
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return {
X:.5*((2*p1.X)+(-p0.X+p2.X)*t+(2*p0.X-5*p1.X+4*p2.X-p3.X)*t2+(-p0.X+3*p1.X-3*p2.X+p3.X)*t3),
Z:.5*((2*p1.Z)+(-p0.Z+p2.Z)*t+(2*p0.Z-5*p1.Z+4*p2.Z-p3.Z)*t2+(-p0.Z+3*p1.Z-3*p2.Z+p3.Z)*t3)
}}
const TRACK=[];
for(let i=0;i<CP.length;i++){const p0=CP[(i-1+CP.length)%CP.length],p1=CP[i],p2=CP[(i+1)%CP.length],p3=CP[(i+2)%CP.length];for(let j=0;j<18;j++)TRACK.push(catmull(p0,p1,p2,p3,j/18))}
const N=TRACK.length;
function normU(u){return ((u%1)+1)%1}
function sample(u,lane=0){u=normU(u);const f=u*N,i=Math.floor(f)%N,t=f-i,a=TRACK[i],b=TRACK[(i+1)%N];const X=a.X+(b.X-a.X)*t,Z=a.Z+(b.Z-a.Z)*t;let tx=b.X-a.X,tz=b.Z-a.Z,m=Math.hypot(tx,tz)||1;tx/=m;tz/=m;const nx=-tz,nz=tx;return {X:X+nx*lane,Z:Z+nz*lane,tx,tz,nx,nz}}
function angleDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function curvature(u){const p0=sample(u-.010),p1=sample(u),p2=sample(u+.010);const a0=Math.atan2(p1.tz,p1.tx),a1=Math.atan2(p2.tz,p2.tx);return Math.min(1,Math.abs(angleDiff(a1,a0))/0.72)}
function brakingDemand(u){return Math.max(curvature(u+.010),curvature(u+.024)*1.08,curvature(u+.042)*.95)}

const COLORS=['#ff3535','#3991ff','#ffd43b','#fff','#2ae48e','#b36cff','#ff8b32','#16d6d6','#ff5ab3'];
const cars=Array.from({length:18},(_,i)=>{
 const skill=.94+((i*7)%11)*.008;
 const max=.0300*skill;
 return {u:normU(.02+i/18),lane:(i%2?.33:-.33)*9,laneTarget:(i%2?.33:-.33)*9,v:.010,max,accel:.030+skill*.006,brake:.070,skill,col:COLORS[i%COLORS.length],overtake:0,lap:0};
});
let mode='AUTO',auto='TV',focus=0,lastAuto=0,frame=0,lastT=performance.now();

function gapAhead(a,b){return normU(b.u-a.u)}
function nearestAhead(car,index){
 let best=null,bestGap=9;
 for(let j=0;j<cars.length;j++){if(j===index)continue;const other=cars[j],g=gapAhead(car,other);if(g>0&&g<bestGap){bestGap=g;best=other}}
 return {car:best,gap:bestGap};
}
function laneFree(index,targetLane){
 const me=cars[index];
 for(let j=0;j<cars.length;j++){if(j===index)continue;const o=cars[j],du=Math.min(gapAhead(me,o),gapAhead(o,me));if(du<.028&&Math.abs(o.lane-targetLane)<8)return false}
 return true;
}
function updateRace(dt){
 for(let i=0;i<cars.length;i++){
   const car=cars[i],curve=brakingDemand(car.u);
   let target=car.max*(1-.58*curve);
   target=Math.max(car.max*.39,target);
   const ahead=nearestAhead(car,i);
   if(ahead.car){
     const sameLane=Math.abs(ahead.car.lane-car.lane)<9;
     if(sameLane&&ahead.gap<.055&&ahead.gap>.020) target*=1.055;
     if(sameLane&&ahead.gap<.026){
       target=Math.min(target,ahead.car.v*(.93+ahead.gap*2.2));
       if(car.overtake<=0){
         const left=-15,right=15;
         const preferred=((i+car.lap)%2===0)?left:right;
         const alt=preferred===left?right:left;
         if(laneFree(i,preferred)){car.laneTarget=preferred;car.overtake=2.8}
         else if(laneFree(i,alt)){car.laneTarget=alt;car.overtake=2.8}
       }
     }
   }
   if(car.overtake>0)car.overtake-=dt;
   else if(curve>.44)car.laneTarget=0;
   else if(Math.abs(car.laneTarget)>10)car.laneTarget*=.997;
   const dv=target-car.v,rate=dv>0?car.accel:car.brake;
   car.v+=Math.max(-rate*dt,Math.min(rate*dt,dv));
   car.v=Math.max(.006,car.v);
   car.lane+=(car.laneTarget-car.lane)*Math.min(1,dt*2.15);
   const old=car.u;car.u=normU(car.u+car.v*dt);if(car.u<old-.5)car.lap++;
 }
}

function camera(t){const f=sample(cars[focus].u,cars[focus].lane);let cx=0,cz=8,zoom=.46;if(t==='CHASE'){const back=62;cx=f.X-f.tx*back;cz=f.Z-f.tz*back;zoom=1.28}else if(t==='HELI'){cx=f.X*.20;cz=f.Z*.20;zoom=.39}else{const q=performance.now()/6000;cx=Math.cos(q)*20;cz=10+Math.sin(q)*16;zoom=.48}return{cx,cz,zoom}}
function project(P,C){const sx=(P.X-C.cx)*C.zoom,sz=(P.Z-C.cz)*C.zoom;const depth=Math.max(.70,1+sz/1150);return{x:W/2+sx/depth,y:H*.47+sz*.57/depth,s:1/depth}}
function pathFor(offset,C){const pts=[];for(let i=0;i<N;i+=2){const a=TRACK[i],b=TRACK[(i+1)%N];let tx=b.X-a.X,tz=b.Z-a.Z,m=Math.hypot(tx,tz)||1;tx/=m;tz/=m;const nx=-tz,nz=tx;pts.push(project({X:a.X+nx*offset,Z:a.Z+nz*offset},C))}return pts}
function strokePath(pts,width,style){x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.closePath();x.strokeStyle=style;x.lineWidth=width;x.lineJoin='round';x.lineCap='round';x.stroke()}
function track(C){
 const center=pathFor(0,C);
 strokePath(center,90*C.zoom,'#244423');
 strokePath(center,70*C.zoom,'#b8b7ae');
 strokePath(center,58*C.zoom,'#34383b');
 const left=pathFor(-30,C),right=pathFor(30,C);
 strokePath(left,2.6*C.zoom,'#f7f7f7');strokePath(right,2.6*C.zoom,'#f7f7f7');
 for(let i=0;i<N;i+=11){const a=TRACK[i],b=TRACK[(i+5)%N];let tx=b.X-a.X,tz=b.Z-a.Z,m=Math.hypot(tx,tz)||1;tx/=m;tz/=m;const nx=-tz,nz=tx;for(const side of [-1,1]){const p1=project({X:a.X+nx*32*side,Z:a.Z+nz*32*side},C),p2=project({X:b.X+nx*32*side,Z:b.Z+nz*32*side},C);x.beginPath();x.moveTo(p1.x,p1.y);x.lineTo(p2.x,p2.y);x.strokeStyle=((i/11)%2===0)?'#d41f2c':'#fff';x.lineWidth=5*C.zoom;x.stroke()}}
 const sf=sample(.015),q1=project({X:sf.X-sf.tz*28,Z:sf.Z+sf.tx*28},C),q2=project({X:sf.X+sf.tz*28,Z:sf.Z-sf.tx*28},C);x.beginPath();x.moveTo(q1.x,q1.y);x.lineTo(q2.x,q2.y);x.strokeStyle='#fff';x.lineWidth=5*C.zoom;x.stroke();
}
function drawCar(car,i,C){const P=sample(car.u,car.lane),P2=sample(car.u+.0022,car.lane),q=project(P,C),q2=project(P2,C),ang=Math.atan2(q2.y-q.y,q2.x-q.x),scale=Math.max(.50,Math.min(1.45,q.s*C.zoom*1.75)),w=17*scale,h=8*scale;x.save();x.translate(q.x,q.y);x.rotate(ang);x.fillStyle='#0008';x.fillRect(-w*.58,-h*.18,w*1.16,h*.95);x.fillStyle=car.col;x.fillRect(-w/2,-h/2,w,h);x.fillStyle='#0d1821';x.fillRect(-w*.08,-h*.42,w*.34,h*.84);x.fillStyle='#111';x.fillRect(-w*.48,-h*.62,w*.18,h*.22);x.fillRect(w*.30,-h*.62,w*.18,h*.22);x.fillRect(-w*.48,h*.40,w*.18,h*.22);x.fillRect(w*.30,h*.40,w*.18,h*.22);if(i===focus){x.strokeStyle='#fff';x.lineWidth=2.2;x.strokeRect(-w*.65,-h*.82,w*1.3,h*1.64)}x.restore()}
function scenery(C){const grass=x.createLinearGradient(0,H*.25,0,H);grass.addColorStop(0,'#709555');grass.addColorStop(1,'#29472a');x.fillStyle=grass;x.fillRect(0,H*.25,W,H*.75);x.fillStyle='#8b969d';for(const [X,Z] of [[-270,215],[-210,223],[-150,226],[-90,225],[-30,221]]){const q=project({X,Z},C);x.fillRect(q.x-18*C.zoom,q.y-10*C.zoom,36*C.zoom,10*C.zoom)}}
function render(now){const active=mode==='AUTO'?auto:mode,C=camera(active);const sky=x.createLinearGradient(0,0,0,H*.32);sky.addColorStop(0,'#6da4cf');sky.addColorStop(1,'#dbe8ef');x.fillStyle=sky;x.fillRect(0,0,W,H);scenery(C);track(C);const order=cars.map((car,i)=>({car,i,z:sample(car.u,car.lane).Z})).sort((a,b)=>a.z-b.z);for(const o of order)drawCar(o.car,o.i,C);const fc=cars[focus],kmh=Math.round(110+fc.v/fc.max*190);x.fillStyle='#0009';x.fillRect(10,H-126,210,34);x.fillStyle='white';x.font='700 12px -apple-system';x.fillText(`CAR ${focus+1} · ${active} · ${kmh} km/h`,20,H-104)}
function tick(now){const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;updateRace(dt);if(mode==='AUTO'&&now-lastAuto>5500){lastAuto=now;auto=auto==='TV'?'CHASE':auto==='CHASE'?'HELI':'TV';camEl.textContent='AUTO · '+auto}render(now);frame++;if(frame===2)status.textContent='RUNNING';requestAnimationFrame(tick)}
function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('active',b.dataset.m===m));camEl.textContent=m==='AUTO'?'AUTO · '+auto:m;render(performance.now())}
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
document.getElementById('next').addEventListener('click',()=>{focus=(focus+1)%cars.length;render(performance.now())});
document.getElementById('prev').addEventListener('click',()=>{focus=(focus-1+cars.length)%cars.length;render(performance.now())});
window.addEventListener('error',e=>{err.style.display='block';err.textContent='Error: '+e.message});
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
